name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Build & publish linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Install revel CLI
        run: go install github.com/revel/cmd/revel@v1.0.3

      - name: Build linux/amd64 package
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: bash sh/package-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/leanote-linux-amd64-*.bin.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
