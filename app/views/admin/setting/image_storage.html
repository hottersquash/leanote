{{template "admin/top.html" .}}
<div class="m-b-md"> <h3 class="m-b-none">{{msg . "adminImageStorage"}}</h3></div>

<div class="row">

<div class="col-sm-8">
	<form id="image_storage_form">
		<section class="panel panel-default">
			<div class="panel-body">
				<div class="form-group">
					<label>{{msg . "adminProvider"}}</label>
					<select class="form-control" name="provider">
						<option value="local" {{if eq .str.imageStorageProvider "local"}}selected{{end}}>{{msg . "adminLocal"}}</option>
						<option value="huawei_obs" {{if eq .str.imageStorageProvider "huawei_obs"}}selected{{end}}>{{msg . "adminHuaweiObs"}}</option>
						<option value="aliyun_oss" {{if eq .str.imageStorageProvider "aliyun_oss"}}selected{{end}}>{{msg . "adminAliyunOss"}}</option>
						<option value="tencent_cos" {{if eq .str.imageStorageProvider "tencent_cos"}}selected{{end}}>{{msg . "adminTencentCos"}}</option>
						<option value="aws_s3" {{if eq .str.imageStorageProvider "aws_s3"}}selected{{end}}>{{msg . "adminAwsS3"}}</option>
					</select>
					{{msg . "adminImageStorageScope"}}
				</div>
				<div class="form-group">
					<label>{{msg . "adminBucket"}}</label>
					<input type="text" class="form-control" name="bucket" value="{{.str.imageStorageBucket}}" placeholder="leanote-images">
				</div>
				<div class="form-group">
					<label>{{msg . "adminEndpoint"}}</label>
					<input type="text" class="form-control" name="endpoint" value="{{.str.imageStorageEndpoint}}" placeholder="obs.cn-north-4.myhuaweicloud.com">
					{{msg . "adminEndpointHelp"}}
				</div>
				<div class="form-group">
					<label>{{msg . "adminRegion"}}</label>
					<input type="text" class="form-control" name="region" value="{{.str.imageStorageRegion}}" placeholder="cn-north-4">
					{{msg . "adminRegionHelp"}}
				</div>
				<div class="form-group">
					<label>{{msg . "adminAccessKey"}}</label>
					<input type="text" class="form-control" name="accessKey" value="{{.str.imageStorageAccessKey}}">
				</div>
				<div class="form-group">
					<label>{{msg . "adminSecretKey"}}</label>
					<input type="password" class="form-control" name="secretKey" value="{{.str.imageStorageSecretKey}}">
				</div>
				<div class="form-group">
					<label>{{msg . "adminPublicBaseUrl"}}</label>
					<input type="text" class="form-control" name="publicBaseUrl" value="{{.str.imageStoragePublicBaseUrl}}" placeholder="https://cdn.example.com">
					{{msg . "adminPublicBaseUrlHelp"}}
				</div>
				<div class="form-group">
					<label>{{msg . "adminObjectPrefix"}}</label>
					<input type="text" class="form-control" name="objectPrefix" value="{{.str.imageStorageObjectPrefix}}" placeholder="leanote/images">
					{{msg . "adminObjectPrefixHelp"}}
				</div>
			</div>

			<footer class="panel-footer text-right bg-light lter">
				<button type="submit" id="submit" class="btn btn-success btn-s-xs">{{msg . "adminSubmit"}}</button>
			</footer>
		</section>
	</form>
</div>

</div>

{{template "admin/footer.html" .}}
<script src="/public/admin/js/jquery-validation-1.13.0/jquery.validate.js"></script>
<script>
$(function() {
	init_validator("#image_storage_form");

	$("#submit").click(function(e){
		e.preventDefault();
		var t = this;
		if($("#image_storage_form").valid()) {
			$(t).button('loading');
			ajaxPost("/adminSetting/imageStorage", getFormJsonData("image_storage_form"), function(ret){
				$(t).button('reset');
				if(!ret.Ok) {
					art.alert(ret.Msg || "{{msg . "adminSaveFailed"}}");
				} else {
					art.tips("{{msg . "adminSuccess"}}");
				}
			});
		}
	});
});
</script>

{{template "admin/end.html" .}}
