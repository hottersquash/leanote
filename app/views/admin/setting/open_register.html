{{template "admin/top.html" .}}
<div class="m-b-md"> <h3 class="m-b-none">{{msg . "adminOpenRegister"}}</h3></div>

<div class="row">

<div class="col-sm-6">
	<form id="form_data">
		<section class="panel panel-default">
			<div class="panel-body">
				<div class="form-group">
					<label>{{msg . "adminOpen"}}</label>
					<input type="checkbox" class="form-control" name="openRegister" {{if .str.openRegister}}checked="checked"{{end}} value="1">
				</div>
			</div>
			
			<footer class="panel-footer text-right bg-light lter">
				<button type="submit" id="submit" class="btn btn-success btn-s-xs">{{msg . "adminSubmit"}}</button>
			</footer>
		</section>
	</form>
</div>

</div>

{{template "admin/footer.html" .}}
<script src="/public/admin/js/jquery-validation-1.13.0/jquery.validate.js"></script>
<script>
$(function() {
	init_validator("#form_data");
	$("#submit").click(function(e){
		e.preventDefault();
		var t = this;
		if($("#form_data").valid()) {
			$(t).button('loading');
			ajaxPost("/adminSetting/openRegister", getFormJsonData("form_data"), function(ret){
				$(t).button('reset')
				if(!ret.Ok) {
					art.alert(ret.Msg)
				} else {
					art.tips("{{msg . "adminSuccess"}}");
				}
			});
		}
	});
});
</script>

{{template "admin/end.html" .}}
