{{template "admin/top.html" .}}
<div class="m-b-md"> <h3 class="m-b-none">{{msg . "adminExportPdf"}}</h3></div>

<div class="row">

<div class="col-sm-8">
	<form id="add_user_form">
		<section class="panel panel-default">
			<div class="panel-body">
				<div class="form-group">
					<label>{{msg . "adminWkhtmltopdfPath"}}</label>
					<input type="text" class="form-control" placeholder="/usr/local/bin/wkhtmltopdf or C:\Program Files\wkhtmltopdf\bin\wkhtmltopdf.exe" name="path" value="{{.str.exportPdfBinPath}}">
					{{msg . "adminExportPdfHelp1"}}
					<br />
					{{msg . "adminExportPdfHelp2"}}
				</div>
			</div>

			<footer class="panel-footer text-right bg-light lter">
				<button type="submit" id="submit" class="btn btn-success btn-s-xs">{{msg . "adminSubmit"}}</button>
			</footer>
		</section>
	</form>
</div>

</div>

{{template "admin/footer.html" .}}
<script src="/public/admin/js/jquery-validation-1.13.0/jquery.validate.js"></script>
<script>
$(function() {
	init_validator("#add_user_form");
	
	$("#submit").click(function(e){
			e.preventDefault();
			var t = this;
			if($("#add_user_form").valid()) {
				$(t).button('loading');
				ajaxPost("/adminSetting/exportPdf", getFormJsonData("add_user_form"), function(ret){
					$(t).button('reset')
					if(!ret.Ok) {
						art.alert(ret.Msg)
					} else {
						art.tips("{{msg . "adminSuccess"}}");
					}
				});
			}
		});
});
</script>

{{template "admin/end.html" .}}
