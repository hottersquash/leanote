# 图片存储
adminProvider=存储提供商
adminLocal=本地
adminHuaweiObs=华为云 OBS
adminAliyunOss=阿里云 OSS
adminTencentCos=腾讯云 COS
adminAwsS3=AWS S3
adminImageStorageScope=仅笔记正文中的图片使用此存储。头像、博客 Logo、相册和附件仍使用本地存储。
adminBucket=Bucket
adminEndpoint=Endpoint
adminEndpointHelp=不要包含 Bucket 名称。错误示例：<code>picture-byan.obs.cn-north-4.myhuaweicloud.com</code>。正确示例：<code>obs.cn-north-4.myhuaweicloud.com</code>。参考：华为 OBS <code>obs.cn-north-4.myhuaweicloud.com</code>，阿里云 OSS <code>oss-cn-hangzhou.aliyuncs.com</code>，腾讯云 COS <code>cos.ap-guangzhou.myqcloud.com</code>，AWS S3 <code>s3.us-west-2.amazonaws.com</code>。可填写 https:// 或纯主机名。出现 SignatureDoesNotMatch 时，通常是 Secret Key 错误，或 Endpoint 里带了 Bucket。
adminRegion=Region
adminRegionHelp=腾讯云 COS 和 AWS S3 必填。阿里云 OSS 可用 Region 代替 Endpoint（例如 <code>cn-hangzhou</code> 会拼成 <code>oss-cn-hangzhou.aliyuncs.com</code>）。
adminAccessKey=Access Key
adminSecretKey=Secret Key
adminPublicBaseUrl=公网访问 URL
adminPublicBaseUrlHelp=可选。留空时，Leanote 会根据 Bucket 和 Endpoint 拼装访问地址。
adminObjectPrefix=对象前缀
adminObjectPrefixHelp=可选。示例：<code>leanote/img</code>（斜杠两侧不要空格）。用户与日期路径会追加在此前缀之后。

