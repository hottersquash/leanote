# 圖片儲存
adminProvider=儲存提供商
adminLocal=本機
adminHuaweiObs=華為雲 OBS
adminAliyunOss=阿里雲 OSS
adminTencentCos=騰訊雲 COS
adminAwsS3=AWS S3
adminImageStorageScope=僅筆記正文中的圖片使用此儲存。頭像、部落格 Logo、相簿和附件仍使用本機儲存。
adminBucket=Bucket
adminEndpoint=Endpoint
adminEndpointHelp=不要包含 Bucket 名稱。錯誤範例：<code>picture-byan.obs.cn-north-4.myhuaweicloud.com</code>。正確範例：<code>obs.cn-north-4.myhuaweicloud.com</code>。參考：華為 OBS <code>obs.cn-north-4.myhuaweicloud.com</code>，阿里雲 OSS <code>oss-cn-hangzhou.aliyuncs.com</code>，騰訊雲 COS <code>cos.ap-guangzhou.myqcloud.com</code>，AWS S3 <code>s3.us-west-2.amazonaws.com</code>。可填寫 https:// 或純主機名。出現 SignatureDoesNotMatch 時，通常是 Secret Key 錯誤，或 Endpoint 裡帶了 Bucket。
adminRegion=Region
adminRegionHelp=騰訊雲 COS 和 AWS S3 必填。阿里雲 OSS 可用 Region 代替 Endpoint（例如 <code>cn-hangzhou</code> 會拼成 <code>oss-cn-hangzhou.aliyuncs.com</code>）。
adminAccessKey=Access Key
adminSecretKey=Secret Key
adminPublicBaseUrl=公網存取 URL
adminPublicBaseUrlHelp=可選。留空時，Leanote 會根據 Bucket 和 Endpoint 組裝存取位址。
adminObjectPrefix=物件前綴
adminObjectPrefixHelp=可選。範例：<code>leanote/img</code>（斜線兩側不要空格）。用戶與日期路徑會追加在此前綴之後。

