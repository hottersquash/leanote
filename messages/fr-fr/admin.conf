adminAwsS3=AWS S3
adminImageStorageScope=Only note body images use this storage. Avatar, blog logo, albums, and attachments keep using local storage.
adminBucket=Bucket
adminEndpoint=Endpoint
adminEndpointHelp=Do not include the bucket name. Wrong: <code>picture-byan.obs.cn-north-4.myhuaweicloud.com</code>. Right: <code>obs.cn-north-4.myhuaweicloud.com</code>. Examples: Huawei OBS <code>obs.cn-north-4.myhuaweicloud.com</code>, Aliyun OSS <code>oss-cn-hangzhou.aliyuncs.com</code>, Tencent COS <code>cos.ap-guangzhou.myqcloud.com</code>, AWS S3 <code>s3.us-west-2.amazonaws.com</code>. Both https:// and plain host are accepted. A SignatureDoesNotMatch error usually means the Secret Key is wrong or the endpoint includes the bucket.
adminRegion=Region
adminRegionHelp=Required for Tencent COS and AWS S3. Aliyun OSS can use region instead of endpoint (e.g. <code>cn-hangzhou</code> builds <code>oss-cn-hangzhou.aliyuncs.com</code>).
adminAccessKey=Access Key
adminSecretKey=Secret Key
adminPublicBaseUrl=Public Base URL
adminPublicBaseUrlHelp=Optional. If blank, Leanote builds URLs from bucket and endpoint.
adminObjectPrefix=Object Prefix
adminObjectPrefixHelp=Optional. Example: <code>leanote/img</code> (no spaces around /). The user and date path will be appended below this prefix.

# Export PDF
